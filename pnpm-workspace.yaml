minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
saveExact: true
# Typography pins 6.0.10, which has a selector-parsing denial of service.
overrides:
  '@tailwindcss/typography>postcss-selector-parser': 6.1.6
  # Nodemon uses the minimatch API retained in the fixed 11.x release.
  'nodemon>minimatch': 11.0.9
